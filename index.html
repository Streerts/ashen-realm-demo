<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Ashen Realm — Demo</title>
<style>
  :root { --ink:#0d1110; --panel:#141c1aee; --gold:#e6c36a; --sage:#8fbf8a; --hp:#c45c4a; }
  * { box-sizing:border-box; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:#0b100f; color:#e8e0d0; font-family:Georgia,"Times New Roman",serif; overflow:hidden; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; inset:0; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  #top { position:absolute; top:8px; left:8px; right:8px; display:flex; gap:8px; align-items:flex-start; }
  .panel { background:var(--panel); border:1px solid #3a4a3f; border-radius:10px; padding:8px 10px; backdrop-filter:blur(6px); }
  #stats { min-width:150px; font-size:13px; line-height:1.35; }
  #stats b { color:var(--gold); }
  #quest { flex:1; font-size:13px; max-width:280px; }
  #bars { position:absolute; bottom:86px; left:8px; width:160px; }
  .bar { height:10px; background:#1a2220; border-radius:6px; overflow:hidden; margin-top:4px; border:1px solid #334; }
  .bar > i { display:block; height:100%; background:var(--hp); width:100%; }
  .bar.xp > i { background:#6aa3c9; }
  #dock { position:absolute; bottom:8px; left:8px; right:8px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  button.ui { background:#1c2824; color:#e8e0d0; border:1px solid #4a5d4e; border-radius:10px; padding:10px 12px; font:600 13px/1 Georgia,serif; }
  button.ui:active { transform:scale(.97); background:#2a3a32; }
  #log { position:absolute; bottom:86px; right:8px; width:min(240px,46vw); max-height:120px; overflow:auto; font-size:12px; opacity:.92; }
  #inv, #shop { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(340px,92vw); display:none; }
  #inv h3, #shop h3 { margin:0 0 8px; color:var(--gold); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .slot { background:#0e1513; border:1px solid #3a4a3f; border-radius:8px; min-height:52px; padding:6px; font-size:11px; text-align:center; }
  #title { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 30%,#1c2a24 0%,#070a09 70%); }
  #title .card { text-align:center; padding:28px 22px; }
  #title h1 { margin:0 0 6px; font-size:34px; letter-spacing:.08em; color:var(--gold); }
  #title p { margin:0 0 18px; opacity:.85; max-width:320px; }
  #hint { position:absolute; top:50%; left:50%; transform:translate(-50%,80px); font-size:12px; opacity:.7; pointer-events:none; text-shadow:0 1px 4px #000; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="top">
      <div id="stats" class="panel"></div>
      <div id="quest" class="panel"></div>
    </div>
    <div id="bars" class="panel">
      HP <div class="bar"><i id="hpbar"></i></div>
      Woodcutting XP <div class="bar xp"><i id="xpbar"></i></div>
    </div>
    <div id="log" class="panel"></div>
    <div id="dock">
      <button class="ui" id="btnInv">Inventory</button>
      <button class="ui" id="btnSkills">Skills</button>
      <button class="ui" id="btnPlace">Place block</button>
    </div>
    <div id="inv" class="panel"></div>
    <div id="shop" class="panel"></div>
    <div id="hint">Tap the ground to walk. Tap a tree, rock, goblin, or person to act.</div>
  </div>
  <div id="title">
    <div class="card panel">
      <h1>ASHEN REALM</h1>
      <p>Click-to-move valley demo. Chop, mine, fight, trade Crowns, place a block on your plot.</p>
      <button class="ui" id="btnStart">Enter World 1</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,dpr=Math.min(2,devicePixelRatio||1);
function resize(){
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();
const TILE=48; const WORLD=48;
function lerp(a,b,t){return a+(b-a)*t}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const player = {
  x:24*TILE, y:28*TILE, tx:24*TILE, ty:28*TILE, speed:140,
  hp:40, maxhp:40, crowns:25, name:'Wanderer',
  skills:{ woodcutting:1, mining:1, attack:1, smithing:1, construction:1 },
  xp:{ woodcutting:0, mining:0, attack:0, smithing:0, construction:0 },
  inv:{ logs:0, oak:0, tin:0, copper:0, stone:0, bronze_bar:0, bronze_sword:0, cooked_fish:2, block:2 },
  weapon:0
};
const cam = {x:player.x,y:player.y};
const logs = [];
function say(m){ logs.unshift(m); if(logs.length>8)logs.pop(); renderLog(); }
function need(skill){ return Math.floor(50+player.skills[skill]*player.skills[skill]*18); }
function addXp(skill,n){
  player.xp[skill]+=n;
  while(player.xp[skill]>=need(skill) && player.skills[skill]<99){
    player.xp[skill]-=need(skill);
    player.skills[skill]++;
    say(skill[0].toUpperCase()+skill.slice(1)+' level '+player.skills[skill]);
  }
}
const trees=[], rocks=[], mobs=[], npcs=[], plots=[], placed=[], others=[];
function seed(){
  for(let i=0;i<70;i++){
    trees.push({x:(4+Math.random()*40)*TILE,y:(4+Math.random()*20)*TILE,hp:8,kind:Math.random()>.78?'oak':'tree',alive:true,t:0});
  }
  for(let i=0;i<40;i++){
    const k = Math.random();
    rocks.push({x:(6+Math.random()*36)*TILE,y:(22+Math.random()*18)*TILE,hp:10,kind:k>.7?'copper':k>.4?'tin':'stone',alive:true,t:0});
  }
  for(let i=0;i<10;i++){
    mobs.push({x:(30+Math.random()*12)*TILE,y:(18+Math.random()*16)*TILE,hp:12,max:12,alive:true,aggro:false,name:'Goblin'});
  }
  npcs.push({x:22*TILE,y:30*TILE,name:'Warden Ellis',role:'quest'});
  npcs.push({x:26*TILE,y:29*TILE,name:'Mira the Trader',role:'shop'});
  npcs.push({x:24*TILE,y:32*TILE,name:'Bank of Crowns',role:'bank'});
  plots.push({x:18*TILE,y:26*TILE,w:4*TILE,h:4*TILE});
  for(let i=0;i<5;i++){
    others.push({x:(20+Math.random()*10)*TILE,y:(24+Math.random()*8)*TILE,tx:0,ty:0,name:['Rook','Pebble','Ash','Nettle','Bram'][i],c:'#9bb7c9'});
    others[i].tx=others[i].x; others[i].ty=others[i].y;
  }
}
seed();
const quest = { step:0, text:'Talk to Warden Ellis in town (south).' };
function setQuest(s,t){ quest.step=s; quest.text=t; renderHUD(); }
function tryAct(wx,wy){
  const target = {x:wx,y:wy};
  const nTree = trees.find(t=>t.alive && dist(target,t)<28);
  const nRock = rocks.find(t=>t.alive && dist(target,t)<28);
  const nMob = mobs.find(t=>t.alive && dist(target,t)<30);
  const nNpc = npcs.find(t=>dist(target,t)<32);
  if(nTree){ player.tx=nTree.x; player.ty=nTree.y; player.intent={type:'chop',obj:nTree}; return; }
  if(nRock){ player.tx=nRock.x; player.ty=nRock.y; player.intent={type:'mine',obj:nRock}; return; }
  if(nMob){ player.tx=nMob.x; player.ty=nMob.y; player.intent={type:'fight',obj:nMob}; return; }
  if(nNpc){ player.tx=nNpc.x; player.ty=nNpc.y; player.intent={type:'talk',obj:nNpc}; return; }
  player.intent=null;
  player.tx=clamp(wx,TILE,WORLD*TILE-TILE);
  player.ty=clamp(wy,TILE,WORLD*TILE-TILE);
}
function chop(obj,dt){
  if(dist(player,obj)>36) return;
  obj.t=(obj.t||0)+dt;
  if(obj.t>0.45){
    obj.t=0; obj.hp--;
    if(obj.hp<=0){
      obj.alive=false;
      if(obj.kind==='oak'){ player.inv.oak++; say('You chop an oak. +oak log'); addXp('woodcutting',28); }
      else { player.inv.logs++; say('You chop a tree. +log'); addXp('woodcutting',18); }
      if(quest.step===1) setQuest(2,'Mine tin or copper in the hills.');
      setTimeout(()=>{obj.alive=true; obj.hp=8;}, 18000);
    }
  }
}
function mine(obj,dt){
  if(dist(player,obj)>36) return;
  obj.t=(obj.t||0)+dt;
  if(obj.t>0.5){
    obj.t=0; obj.hp--;
    if(obj.hp<=0){
      obj.alive=false;
      player.inv[obj.kind]++;
      say('You mine '+obj.kind+'.');
      addXp('mining', obj.kind==='stone'?12:22);
      if(quest.step===2 && (obj.kind==='tin'||obj.kind==='copper')) setQuest(3,'Smelt a bronze bar at the town forge (talk to Mira).');
      setTimeout(()=>{obj.alive=true; obj.hp=10;}, 20000);
    }
  }
}
function fight(obj,dt){
  if(!obj.alive) return;
  obj.aggro=true;
  if(dist(player,obj)>40){ player.tx=obj.x; player.ty=obj.y; return; }
  obj.atk=(obj.atk||0)+dt;
  player.atk=(player.atk||0)+dt;
  if(player.atk>0.7){
    player.atk=0;
    const dmg = 3 + player.skills.attack + (player.inv.bronze_sword?4:0);
    obj.hp-=dmg;
    say('You hit the goblin for '+dmg+'.');
    addXp('attack',8);
    if(obj.hp<=0){
      obj.alive=false;
      const loot = 4+Math.floor(Math.random()*8);
      player.crowns+=loot;
      say('Goblin falls. +'+loot+' Crowns');
      if(quest.step===4) setQuest(5,'Return to Warden Ellis.');
      setTimeout(()=>{obj.alive=true; obj.hp=obj.max; obj.x+=(Math.random()-0.5)*80;}, 16000);
    }
  }
  if(obj.atk>1.1){
    obj.atk=0;
    const dmg=2+Math.floor(Math.random()*4);
    player.hp=Math.max(0,player.hp-dmg);
    if(player.hp<=0){
      player.hp=player.maxhp;
      player.x=24*TILE; player.y=28*TILE; player.tx=player.x; player.ty=player.y;
      player.crowns=Math.max(0,player.crowns-8);
      say('You fall. Wake in town. Lost 8 Crowns.');
    }
  }
}
function talk(npc){
  if(dist(player,npc)>40) return;
  player.intent=null;
  if(npc.role==='quest'){
    if(quest.step===0){ setQuest(1,'Chop any tree for a log.'); say(npc.name+': The valley needs timber and ore. Start with a tree.'); }
    else if(quest.step===5){ setQuest(6,'Quest complete. Keep exploring.'); player.crowns+=40; player.inv.block+=4; say(npc.name+': The north is quieter for it. Take these Crowns and blocks.'); }
    else say(npc.name+': '+quest.text);
  }
  if(npc.role==='shop'){
    if(quest.step===3 && player.inv.tin>0 && player.inv.copper>0){
      player.inv.tin--; player.inv.copper--; player.inv.bronze_bar++;
      addXp('smithing',30);
      setQuest(4,'Kill a goblin east of town.');
      say('Mira smelts your ore into a bronze bar.');
    }
    openShop();
  }
  if(npc.role==='bank') say('Your wealth is already on this shard. Crowns: '+player.crowns);
}
function openInv(){
  const el=document.getElementById('inv');
  const items=Object.entries(player.inv).filter(([,n])=>n>0).map(([k,n])=>`<div class="slot">${k.replace('_',' ')}<br><b>${n}</b></div>`).join('')||'<div class="slot">empty</div>';
  el.innerHTML=`<h3>Pack</h3><div class="grid">${items}</div><p style="margin:8px 0 0;font-size:12px">Crowns: ${player.crowns}</p><button class="ui" id="cInv">Close</button>`;
  el.style.display='block';
  document.getElementById('cInv').onclick=()=>el.style.display='none';
}
function openSkills(){
  const el=document.getElementById('inv');
  el.innerHTML='<h3>Skills</h3>'+Object.keys(player.skills).map(s=>`<div>${s}: <b>${player.skills[s]}</b> (${player.xp[s]}/${need(s)} xp)</div>`).join('')+'<button class="ui" id="cInv">Close</button>';
  el.style.display='block';
  document.getElementById('cInv').onclick=()=>el.style.display='none';
}
function openShop(){
  const el=document.getElementById('shop');
  el.innerHTML=`<h3>Mira's stall</h3>
    <p style="font-size:13px">Bronze sword — 35 Crowns<br>Cooked fish — 6 Crowns<br>Building block — 8 Crowns<br>Sell logs 3c · ore 5c · bar 18c</p>
    <button class="ui" data-b="sword">Buy sword</button>
    <button class="ui" data-b="fish">Buy fish</button>
    <button class="ui" data-b="block">Buy block</button>
    <button class="ui" data-b="sell">Sell extras</button>
    <button class="ui" id="cShop">Close</button>`;
  el.style.display='block';
  el.onclick=e=>{
    const b=e.target.dataset.b;
    if(b==='sword' && player.crowns>=35){player.crowns-=35;player.inv.bronze_sword++;say('Bought a bronze sword.');}
    if(b==='fish' && player.crowns>=6){player.crowns-=6;player.inv.cooked_fish++;say('Bought fish.');}
    if(b==='block' && player.crowns>=8){player.crowns-=8;player.inv.block++;say('Bought a block.');}
    if(b==='sell'){
      const g=player.inv.logs*3+player.inv.oak*5+player.inv.tin*5+player.inv.copper*5+player.inv.stone*2+player.inv.bronze_bar*18;
      if(g){ player.crowns+=g; player.inv.logs=player.inv.oak=player.inv.tin=player.inv.copper=player.inv.stone=player.inv.bronze_bar=0; say('Sold goods for '+g+' Crowns.'); }
    }
    if(e.target.id==='cShop') el.style.display='none';
    renderHUD();
  };
}
document.getElementById('btnInv').onclick=openInv;
document.getElementById('btnSkills').onclick=openSkills;
document.getElementById('btnPlace').onclick=()=>{
  const plot=plots[0];
  if(player.x<plot.x||player.x>plot.x+plot.w||player.y<plot.y||player.y>plot.y+plot.h){
    say('Stand on your marked plot (west of town) to place a block.');
    return;
  }
  if(player.inv.block<=0){ say('No blocks. Buy from Mira or finish the quest.'); return; }
  player.inv.block--;
  placed.push({x:player.x,y:player.y});
  addXp('construction',20);
  say('You set a block. Construction +xp');
};
function worldFromEvent(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  const sx=t.clientX-r.left, sy=t.clientY-r.top;
  return {x:sx+cam.x-W/2, y:sy+cam.y-H/2};
}
function onPointer(e){
  if(document.getElementById('title').style.display==='none'){
    const p=worldFromEvent(e);
    tryAct(p.x,p.y);
    document.getElementById('hint').style.opacity='0';
  }
}
canvas.addEventListener('mousedown',onPointer);
canvas.addEventListener('touchstart',e=>{onPointer(e);},{passive:true});
document.getElementById('btnStart').onclick=()=>{
  document.getElementById('title').style.display='none';
  say('World 1 — Ashen Valley. Soft cap demo.');
  setQuest(0,quest.text);
};
function renderHUD(){
  document.getElementById('stats').innerHTML=`<b>${player.name}</b><br>Crowns ${player.crowns}<br>Atk ${player.skills.attack} · WC ${player.skills.woodcutting} · Mn ${player.skills.mining}`;
  document.getElementById('quest').innerHTML=`<b>Quest</b><br>${quest.text}`;
  document.getElementById('hpbar').style.width=(player.hp/player.maxhp*100)+'%';
  const n=need('woodcutting');
  document.getElementById('xpbar').style.width=(player.xp.woodcutting/n*100)+'%';
}
function renderLog(){ document.getElementById('log').innerHTML=logs.join('<br>'); }
function drawTree(t){
  if(!t.alive) return;
  ctx.fillStyle='#2b4a28';
  ctx.beginPath(); ctx.ellipse(t.x,t.y+6,16,8,0,0,6.3); ctx.fill();
  ctx.fillStyle=t.kind==='oak'?'#2f6b38':'#3d7a42';
  ctx.beginPath(); ctx.arc(t.x,t.y-16,18,0,6.3); ctx.fill();
  ctx.fillStyle='#6b4428'; ctx.fillRect(t.x-4,t.y-8,8,16);
}
function drawRock(r){
  if(!r.alive) return;
  ctx.fillStyle=r.kind==='copper'?'#b56a3a':r.kind==='tin'?'#9aa4b0':'#6d7270';
  ctx.beginPath();
  ctx.moveTo(r.x-14,r.y+8); ctx.lineTo(r.x-10,r.y-10); ctx.lineTo(r.x+8,r.y-14); ctx.lineTo(r.x+16,r.y+6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0006'; ctx.fillRect(r.x-6,r.y-2,12,8);
}
function drawPerson(p,color,me){
  ctx.fillStyle='#0005'; ctx.beginPath(); ctx.ellipse(p.x,p.y+10,10,5,0,0,6.3); ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(p.x,p.y-6,8,0,6.3); ctx.fill();
  ctx.fillRect(p.x-7,p.y-2,14,12);
  if(me && player.inv.bronze_sword){ ctx.fillStyle='#c9d2d8'; ctx.fillRect(p.x+8,p.y-10,3,18); }
  ctx.fillStyle='#f0e6c8'; ctx.font='11px Georgia'; ctx.textAlign='center';
  ctx.fillText(p.name||'', p.x, p.y-20);
}
function drawMob(m){
  if(!m.alive) return;
  ctx.fillStyle='#4a6b3a';
  ctx.beginPath(); ctx.arc(m.x,m.y-4,9,0,6.3); ctx.fill();
  ctx.fillRect(m.x-8,m.y,16,10);
  ctx.fillStyle='#c45c4a';
  ctx.fillRect(m.x-12,m.y-22,24*(m.hp/m.max),3);
}
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const dx=player.tx-player.x, dy=player.ty-player.y, d=Math.hypot(dx,dy);
  if(d>3){ const s=player.speed*dt/d; player.x+=dx*s; player.y+=dy*s; }
  else if(player.intent){
    if(player.intent.type==='chop') chop(player.intent.obj,dt);
    if(player.intent.type==='mine') mine(player.intent.obj,dt);
    if(player.intent.type==='fight') fight(player.intent.obj,dt);
    if(player.intent.type==='talk') talk(player.intent.obj);
  }
  for(const m of mobs){
    if(!m.alive) continue;
    if(m.aggro && dist(m,player)<220){
      const a=Math.atan2(player.y-m.y,player.x-m.x);
      m.x+=Math.cos(a)*55*dt; m.y+=Math.sin(a)*55*dt;
    }
  }
  for(const o of others){
    if(Math.random()<0.004){ o.tx=o.x+(Math.random()-0.5)*180; o.ty=o.y+(Math.random()-0.5)*180; }
    const od=Math.hypot(o.tx-o.x,o.ty-o.y);
    if(od>2){ o.x+=(o.tx-o.x)/od*40*dt; o.y+=(o.ty-o.y)/od*40*dt; }
  }
  if(player.hp<player.maxhp) player.hp=Math.min(player.maxhp,player.hp+2*dt);
  cam.x=lerp(cam.x,player.x,.12); cam.y=lerp(cam.y,player.y,.12);
  ctx.fillStyle='#1a2a1c'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2-cam.x, H/2-cam.y);
  for(let y=0;y<WORLD;y++){
    for(let x=0;x<WORLD;x++){
      const town = x>20&&x<28&&y>27&&y<34;
      ctx.fillStyle = town ? '#3a3a32' : ((x+y)%2? '#2a3d2c':'#263828');
      if(y<10) ctx.fillStyle=(x+y)%2?'#2a4034':'#24382e';
      ctx.fillRect(x*TILE,y*TILE,TILE-1,TILE-1);
    }
  }
  const plot=plots[0];
  ctx.strokeStyle='#e6c36a88'; ctx.strokeRect(plot.x,plot.y,plot.w,plot.h);
  ctx.fillStyle='#e6c36a'; ctx.font='12px Georgia'; ctx.fillText('Your plot',plot.x+8,plot.y-6);
  for(const b of placed){ ctx.fillStyle='#7a5a3a'; ctx.fillRect(b.x-12,b.y-12,24,24); ctx.fillStyle='#5a3e28'; ctx.fillRect(b.x-12,b.y-16,24,6); }
  trees.forEach(drawTree);
  rocks.forEach(drawRock);
  npcs.forEach(n=>drawPerson(n,'#c4a46a'));
  others.forEach(o=>drawPerson(o,o.c));
  mobs.forEach(drawMob);
  drawPerson(player,'#6a9ad4',true);
  ctx.restore();
  renderHUD();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
