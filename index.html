<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Ashen Realm — Emberford</title>
<style>
  :root { --panel:#101814f2; --gold:#e8c56a; }
  * { box-sizing:border-box; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:#070b0a; color:#efe6d4; font-family:Georgia,serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; inset:0; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  #top { position:absolute; top:8px; left:8px; right:110px; display:flex; gap:8px; }
  .panel { background:var(--panel); border:1px solid #4a5d4e88; border-radius:12px; padding:8px 10px; backdrop-filter:blur(8px); box-shadow:0 8px 24px #0006; }
  #stats { min-width:158px; font-size:13px; line-height:1.35; }
  #stats b { color:var(--gold); }
  #quest { flex:1; font-size:13px; max-width:300px; }
  #bars { position:absolute; bottom:86px; left:8px; width:176px; font-size:11px; }
  .bar { height:9px; background:#1a2220; border-radius:6px; overflow:hidden; margin:3px 0 7px; border:1px solid #334; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#a84a3c,#e07a62); }
  .bar.xp i { background:linear-gradient(90deg,#3d7aa0,#7ec3e0); }
  #dock { position:absolute; bottom:8px; left:8px; right:8px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  button.ui { background:#1c2824; color:#efe6d4; border:1px solid #5a7060; border-radius:11px; padding:10px 12px; font:600 13px/1 Georgia,serif; }
  button.ui.wide { width:100%; margin-top:6px; }
  #log { position:absolute; bottom:86px; right:8px; width:min(250px,44vw); max-height:128px; overflow:auto; font-size:12px; }
  #modal { position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); width:min(370px,94vw); max-height:76vh; overflow:auto; display:none; z-index:6; }
  #modal h3 { margin:0 0 6px; color:var(--gold); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .slot { background:#0c1412; border:1px solid #3a4a3f; border-radius:8px; min-height:50px; padding:6px; font-size:11px; text-align:center; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #2a3830; font-size:13px; }
  #title { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 28%,#24352c,#070b0a 68%); z-index:8; }
  #title h1 { margin:0 0 8px; font-size:36px; letter-spacing:.12em; color:var(--gold); }
  #minimap { position:absolute; top:8px; right:8px; width:92px; height:92px; border-radius:10px; border:1px solid #4a5d4e; }
  #clock { position:absolute; top:104px; right:8px; font-size:11px; color:var(--gold); }
</style>
</head>
<body>
<div style="position:relative;width:100%;height:100%">
<canvas id="c"></canvas>
<div id="hud">
  <div id="top"><div id="stats" class="panel"></div><div id="quest" class="panel"></div></div>
  <canvas id="minimap" width="92" height="92"></canvas>
  <div id="clock" class="panel"></div>
  <div id="bars" class="panel">HP <div class="bar"><i id="hpbar"></i></div>Woodcutting <div class="bar xp"><i id="xpbar"></i></div></div>
  <div id="log" class="panel"></div>
  <div id="dock">
    <button class="ui" id="btnInv">Pack</button>
    <button class="ui" id="btnBank">Bank</button>
    <button class="ui" id="btnSkills">Skills</button>
    <button class="ui" id="btnPlace">Build</button>
    <button class="ui" id="btnEat">Eat</button>
  </div>
  <div id="modal" class="panel"></div>
</div>
<div id="title"><div class="panel" style="text-align:center;padding:30px 24px;max-width:380px">
  <h1>ASHEN REALM</h1>
  <p style="opacity:.88;margin:0 0 16px">Emberford at dusk and dawn. Shops glow. The square breathes.</p>
  <button class="ui" id="btnStart">Walk into town</button>
</div></div>
</div>
<script src="game.js"></script>
</body>
</html>
